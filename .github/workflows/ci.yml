name: Firmware and UX checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - run: make test
      - run: make preview
      - uses: actions/upload-artifact@v4
        with:
          name: lvgl-screens
          path: build-host/screens/*.ppm
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: |
            build/smart_scale.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
