name: Firmware and UX checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - run: make test
      - run: make preview
      - uses: actions/upload-artifact@v4
        with:
          name: lvgl-screens
          path: build-host/screens/*.ppm
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        wake: [disabled, expander-v2, custom-direct]
    container: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # Pin the resolver too: older image versions can resolve a second LVGL
          # major during Kconfig retry despite the application's 8.4.0 lock.
          python -m pip install 'idf-component-manager==2.5.2'
          if [ "${{ matrix.wake }}" = expander-v2 ]; then
            echo 'CONFIG_SMART_SCALE_BOARD_35_V2=y' >> sdkconfig.defaults
          elif [ "${{ matrix.wake }}" = custom-direct ]; then
            echo 'CONFIG_SMART_SCALE_TOUCH_WAKE_VERIFIED=y' >> sdkconfig.defaults
            echo 'CONFIG_SMART_SCALE_TOUCH_WAKE_GPIO=16' >> sdkconfig.defaults
          fi
          idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware-${{ matrix.wake }}
          path: |
            build/smart_scale.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flasher_args.json
